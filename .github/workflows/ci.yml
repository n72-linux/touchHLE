name: CI

on:
  push:
    branches: [n72-native]
    tags: ["v*"]
  pull_request:
    branches: [n72-native]

jobs:
  check-n72-tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check n72 build scripts & audit PII
        run: |
          sh -n n72/armhf-cc
          bash -n n72/pgo/build.sh

# OpenAL Soft settings for the n72 build (iPod touch 2G); goes next to the
# touchHLE binary, where OpenAL Soft looks for "alsoft.conf".
#
# The sound card runs 16-bit, 44.1 kHz stereo (ALSA's dmix). With OpenAL's
# default float output, ALSA's plug layer converts every sample to 16 bits
# with a generic routine that costs about as much as mixing a voice; OpenAL's
# own conversion is far cheaper. The limiter and the dither that OpenAL adds
# for integer output are left off: neither ran with float output either (ALSA
# rounds and clips), and the limiter alone doubles the mixer's CPU time here.
# The resampler is the 4-point cubic one, as in Alpine's newer libopenal that
# this build replaces (the vendored release would default to linear).
[general]
sample-type = int16
output-limiter = false
dither = false
resampler = cubic
